packages:
  - packages/*

catalogMode: prefer

catalog:
  "@lilian1315/create-element": 0.13.1
  "@lucide/icons": 1.41.0
  "@zag-js/checkbox": 2.0.0-next.2
  "@zag-js/combobox": 2.0.0-next.2
  "@zag-js/core": 2.0.0-next.2
  "@zag-js/select": 2.0.0-next.2
  "@zag-js/tooltip": 2.0.0-next.2
  "@zag-js/vanilla": 2.0.0-next.2
  "@types/node": ^24
  faisceau: 0.3.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  "@vitest/browser-playwright": 4.1.11
  playwright: ^1.62.1
  vitest: 4.1.11
  "@zag-js/dialog": 2.0.0-next.2
  "@zag-js/toast": 2.0.0-next.2
  "@zag-js/drawer": 2.0.0-next.2
  jsr-exports-lint: ^0.4.2
  publint: ^0.3.24
  yaml: ^2.9.0
  bumpp: ^12.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vite-plus: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@lilian1315/create-element@0.12.1 || 0.13.1"
  - "@lilian1315/elements-writable-properties-types@0.1.3 || 0.1.12"
allowBuilds:
  esbuild: true
